plugins {
    id 'com.android.application'
}

android {
    namespace 'com.homeprojector.settings'
    compileSdk 34

    defaultConfig {
        applicationId 'com.homeprojector.settings'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        debug {
            // This projector's package parser refuses an APK signed with v2 only.
            enableV1Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
